version: '3.8'
services:
  capture:
    build: ./capture
    volumes:
      - ./data:/data
      - /run/user/1000/pulse:/run/user/1000/pulse
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - HOME=/tmp
    devices:
      - /dev/snd
    restart: unless-stopped
    user: "1000:1000"

  transcribe:
    build: ./transcribe
    volumes:
      - ./data:/data
    restart: on-failure
    user: "1000:1000"

  summarize:
    build: ./summarize
    volumes:
      - ./data:/data
    restart: on-failure
    user: "1000:1000"